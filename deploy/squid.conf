# Egress proxy of the Kal stack: the only way out to the internet for the app and the worker.
#
# It accepts HTTPS tunnels (CONNECT on port 443) to the hosts below and refuses everything else:
# other hosts, other ports, plain http and IP addresses. Kal encrypts end to end through the
# tunnel, so the proxy sees only which host is contacted. This file is part of the stack
# configuration on the server; nothing in the web interface can change it.
#
# The allowed hosts are:
#   fixed here      the three AI provider APIs, the Open Food Facts API, the FoodData Central
#                   download host and the Web Push services (Google, Mozilla, Apple, Microsoft)
#   site hosts      squid-start.sh writes /run/squid-allow/site-hosts.txt when the container
#                   starts, from site.env: the host of MEALIE_BASE_URL, OPENGYM_BASE_URL and
#                   OFF_BASE_URL, plus PUSH_SERVICE_HOSTS and EGRESS_EXTRA_HOSTS (comma
#                   separated). To allow one more host, add it to EGRESS_EXTRA_HOSTS in site.env
#                   and restart the egress container; this file stays as it is.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT

# Exact host names; -n stops Squid from looking up names for IP addresses, so a request to a
# bare IP can never match. A leading dot also allows every subdomain.
acl ai_apis dstdomain -n api.openai.com api.anthropic.com generativelanguage.googleapis.com
acl food_data dstdomain -n world.openfoodfacts.org fdc.nal.usda.gov
acl push_services dstdomain -n fcm.googleapis.com updates.push.services.mozilla.com .push.apple.com .notify.windows.com
acl site_hosts dstdomain -n "/run/squid-allow/site-hosts.txt"

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT ai_apis
http_access allow CONNECT food_data
http_access allow CONNECT push_services
http_access allow CONNECT site_hosts
http_access deny all

# A pure tunnel: no cache, no identifying headers, nothing written to disk.
cache deny all
cache_mem 0 MB
forwarded_for delete
httpd_suppress_version_string on
coredump_dir /tmp
pid_filename /run/squid.pid

# CONNECT lines show only host and port, never paths or bodies.
logformat cal %ts.%03tu %>a %rm %ru %>Hs %<st
access_log stdio:/dev/stdout cal
cache_log stdio:/dev/stderr
cache_store_log none
netdb_filename none
# The ICMP pinger needs raw sockets, which this container does not have.
pinger_enable off
logfile_rotate 0
